[project]
name = "maison-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ag-ui-adk==0.9.0", "google-adk>=1.30,<3", "litellm>=1.80,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

